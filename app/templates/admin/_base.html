<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PaliPints Admin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700;900&family=Caveat:wght@500;700&family=Special+Elite&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body data-theme="{{ active_theme }}">
  <header class="admin-header">
    <div class="brand">PaliPints <span class="muted">admin</span></div>
    <nav>
      <a href="{{ url_for('admin.taps') }}" {% if request.endpoint == 'admin.taps' %}class="active"{% endif %}>Taps</a>
      <a href="{{ url_for('admin.beer_library_page') }}" {% if request.endpoint == 'admin.beer_library_page' %}class="active"{% endif %}>Beer library</a>
      <a href="{{ url_for('admin.settings') }}" {% if request.endpoint == 'admin.settings' %}class="active"{% endif %}>Settings</a>
      <a href="{{ url_for('admin.specials') }}" {% if request.endpoint == 'admin.specials' %}class="active"{% endif %}>Specials</a>
      <a href="{{ url_for('admin.events') }}" {% if request.endpoint == 'admin.events' %}class="active"{% endif %}>Events</a>
      <a href="{{ url_for('display.display') }}" target="_blank" rel="noopener">Open display ↗</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
        {% for category, msg in messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
